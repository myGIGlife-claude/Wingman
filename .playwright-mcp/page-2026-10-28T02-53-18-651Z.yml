  - main [ref=f3e9]:
    - heading "Know when to leave. Never miss an OC run." [level=1] [ref=f3e10]
    - paragraph [ref=f3e11]: "Wingman watches your Torn account and tells you what to do next: when to fly out, when stock lands, and when your organized crime is ready. It shows it on an Android home-screen widget and sends alerts to your phone."
    - list [ref=f3e12]:
      - listitem [ref=f3e13]:
        - strong [ref=f3e14]: Travel and OC timing.
        - text: Works out when to leave so you are back before your crime is ready.
      - listitem [ref=f3e15]:
        - strong [ref=f3e16]: Restock tracking.
        - text: Learns how often an item restocks and tells you when the next one is due.
      - listitem [ref=f3e17]:
        - strong [ref=f3e18]: Targets.
        - text: Lists players that fit your level and difficulty, with hospital and offline times.
      - listitem [ref=f3e19]:
        - strong [ref=f3e20]: Your choice of alerts.
        - text: Turn each alert on or off. Energy, nerve, cooldowns and more are optional.
    - paragraph [ref=f3e21]: Wingman only reads your data through the official Torn API. It never plays the game for you. You tap every action yourself.
    - region [ref=f3e22]:
      - heading "Join the Android test" [level=2] [ref=f3e23]
