          - heading "You tap everything" [level=3] [ref=f1e222]
          - paragraph [ref=f1e223]: Wingman only reads your data. It never clicks, attacks or buys for you. Every button opens a Torn page and you do the real action.
        - generic [ref=f1e224]:
          - heading "A Limited key is enough" [level=3] [ref=f1e225]
          - paragraph [ref=f1e226]: The app checks your key when you add it, tells you what works and what does not, and warns you if it has more access than Wingman needs.
