        - generic [ref=f5e221]:
          - heading "You tap everything" [level=3] [ref=f5e222]
          - paragraph [ref=f5e223]: Wingman only reads your data. It never clicks, attacks or buys for you. Every button opens a Torn page and you do the real action.
        - generic [ref=f5e224]:
          - heading "A Limited key is enough" [level=3] [ref=f5e225]
          - paragraph [ref=f5e226]: The app checks your key when you add it, tells you what works and what does not, and warns you if it has more access than Wingman needs.
        - generic [ref=f5e227]:
          - heading "Your data, your call" [level=3] [ref=f5e228]
          - paragraph [ref=f5e229]: Keys are stored encrypted. Delete your account and your key, settings and devices go with it. Wingman is independent and has no link to Torn.
