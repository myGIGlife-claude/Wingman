      - generic [ref=f6e147]:
        - heading "What Wingman tracks every part can be turned off" [level=2] [ref=f6e148]:
          - text: What Wingman tracks
          - generic [ref=f6e149]: every part can be turned off
        - paragraph [ref=f6e154]: Most of this comes from your own Torn account through the official API. Shop stock comes from YATA and NPC attack times from Loot Rangers.
        - table [ref=f6e155]:
          - rowgroup [ref=f6e156]:
            - row [ref=f6e157]:
              - cell "Travel and restocks" [ref=f6e158]
              - cell [ref=f6e159]:
                - list [ref=f6e160]:
                  - listitem [ref=f6e161]: Whether a trip fits before your OC, and how long you have to leave.
                  - listitem [ref=f6e162]: The Fly button greys out once the round trip no longer fits before your OC. Tapping it then shows a warning instead of opening the travel page. You can still fly from Torn itself.
                  - listitem [ref=f6e163]: Your item's stock and price at your destination, and how many you can afford.
                  - listitem [ref=f6e164]: The next restock, estimated from how often the item has restocked before.
                  - listitem [ref=f6e165]: Notifications for ready to fly, landed, back in stock, leave soon, leave now, and staying abroad too long.
            - row [ref=f6e166]:
              - cell "OC and status" [ref=f6e167]
              - cell [ref=f6e168]:
                - list [ref=f6e169]:
                  - listitem [ref=f6e170]: A countdown to your OC that turns yellow, then red, as it gets closer.
                  - listitem [ref=f6e171]: Hospital and jail timers.
                  - listitem [ref=f6e172]: Your cash, and your next step.
            - row [ref=f6e173]:
              - cell "Chains" [ref=f6e174]
              - cell [ref=f6e175]:
                - list [ref=f6e176]:
                  - listitem [ref=f6e177]: Chain count and the time left before it breaks.
                  - listitem [ref=f6e178]: Your own hits and respect in the running chain, counted from your attack log.
                  - listitem [ref=f6e179]: Your rank in the last finished chain, from your faction's chain report.
                  - listitem [ref=f6e180]: A notification when the chain is about to break.
                - paragraph [ref=f6e181]: Needs faction access on your API key.
            - row [ref=f6e182]:
              - cell "Targets" [ref=f6e183]
              - cell [ref=f6e184]:
                - list [ref=f6e185]:
                  - listitem [ref=f6e186]: Takes players from your in-game Targets list and keeps the ones who are offline long enough and not in hospital or traveling.
                  - listitem [ref=f6e187]: Estimates their stats from the fair fights you have actually had. FF is fair fight, so a higher number means a harder target. The "≥" figure is the least total stats they could have. It is never a made-up exact number.
                  - listitem [ref=f6e188]: Add your own FF Scouter key to see many more targets, each with a difficulty rating.
            - row [ref=f6e189]:
              - cell "Bars and cooldowns" [ref=f6e190]
              - cell [ref=f6e191]:
                - list [ref=f6e192]:
                  - listitem [ref=f6e193]: Energy, nerve and health.
                  - listitem [ref=f6e194]: Drug, booster and medical cooldowns, and a warning when one drops under 6 hours.
                  - listitem [ref=f6e195]: Xanax cooldown, plus your addiction penalty, how many you have taken and how many overdoses.
            - row [ref=f6e196]:
              - cell "NPC attacks" [ref=f6e197]
              - cell [ref=f6e198]:
                - paragraph [ref=f6e199]: Scheduled times come from Loot Rangers and can change. Get a notification 10 minutes before and when the attack goes live, with who to hit first.
            - row [ref=f6e200]:
              - cell "Medals and honors" [ref=f6e201]
              - cell [ref=f6e202]:
                - paragraph [ref=f6e203]: A notification when you earn a new one.
            - row [ref=f6e204]:
              - cell "Notifications" [ref=f6e205]
              - cell [ref=f6e206]:
                - paragraph [ref=f6e207]: Each of the 25 alert types has its own switch. The busy ones, like full bars, start off.
