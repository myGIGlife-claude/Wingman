      - generic [ref=f6e316]:
        - heading "How Wingman works" [level=2] [ref=f6e317]
        - table [ref=f6e318]:
          - rowgroup [ref=f6e319]:
            - row [ref=f6e320]:
              - cell "You press everything" [ref=f6e321]
              - cell "Wingman only reads your data. It never clicks, attacks or buys for you. Every button opens a Torn page, and you do the real action." [ref=f6e322]
            - row [ref=f6e323]:
              - cell "A Limited key is enough" [ref=f6e324]
              - cell "The app checks your key when you add it, tells you what works and what does not, and warns you if the key has more access than Wingman needs." [ref=f6e325]
            - row [ref=f6e326]:
              - cell "Your data, your call" [ref=f6e327]
              - cell "Keys are stored encrypted. Delete your account in the app and your key, settings and devices are removed from our server. Wingman is independent and has no link to Torn." [ref=f6e328]
