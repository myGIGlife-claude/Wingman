    - main [ref=f6e99]:
      - generic [ref=f6e100]:
        - heading "Wingman, a companion for Torn Android test" [level=1] [ref=f6e101]:
          - text: Wingman, a companion for Torn
          - generic [ref=f6e102]: Android test
        - generic [ref=f6e104]:
          - generic [ref=f6e105]:
            - paragraph [ref=f6e106]: "Wingman keeps an eye on your Torn account and tells you the next thing to do: when to fly, when your item restocks, when your chain is about to break, when your organized crime (OC) is ready. It runs as widgets on your Android home screen and sends notifications."
            - paragraph [ref=f6e107]: It only reads your data. You press every button in Torn yourself.
            - generic [ref=f6e108]:
              - link "Join the Android test" [ref=f6e109] [cursor=pointer]:
                - /url: "#join"
              - link "See what it tracks" [ref=f6e110] [cursor=pointer]:
                - /url: "#tracks"
            - paragraph [ref=f6e114]: Everything on this page is sample data. The widget on the right follows a trip the way the app shows it. Pick a stage, or let it play.
          - generic [ref=f6e115]:
