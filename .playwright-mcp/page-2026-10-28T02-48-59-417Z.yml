  - main [ref=f2e9]:
    - heading "Know when to leave. Never miss an OC run." [level=1] [ref=f2e10]
    - paragraph [ref=f2e11]: "Wingman watches your Torn account and tells you what to do next: when to fly out, when stock lands, and when your organized crime is ready. It shows it on an Android home-screen widget and sends alerts to your phone."
    - list [ref=f2e12]:
      - listitem [ref=f2e13]:
        - strong [ref=f2e14]: Travel and OC timing.
        - text: Works out when to leave so you are back before your crime is ready.
      - listitem [ref=f2e15]:
        - strong [ref=f2e16]: Restock tracking.
        - text: Learns how often an item restocks and tells you when the next one is due.
      - listitem [ref=f2e17]:
        - strong [ref=f2e18]: Targets.
        - text: Lists players that fit your level and difficulty, with hospital and offline times.
      - listitem [ref=f2e19]:
        - strong [ref=f2e20]: Your choice of alerts.
        - text: Turn each alert on or off. Energy, nerve, cooldowns and more are optional.
    - paragraph [ref=f2e21]: Wingman only reads your data through the official Torn API. It never plays the game for you. You tap every action yourself.
