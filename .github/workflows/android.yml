name: Android
on:
  push:
    paths: ['android/**', 'backend/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci && npx tsc --noEmit && npm test
        working-directory: backend
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Add google-services.json
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then echo "::error::Add the GOOGLE_SERVICES_JSON_B64 repository secret first (see README step 10)."; exit 1; fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      - name: Test and build debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wingman-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
